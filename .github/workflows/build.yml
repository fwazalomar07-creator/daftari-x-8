name: Build Daftari

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # ── منع الإغلاق القسري (exit code 143 = قتل العملية بنفاد الذاكرة) أثناء بناء Gradle/Flutter ──
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC"
  _JAVA_OPTIONS: "-Xmx3g"
  PUB_CACHE: ~/.pub-cache

jobs:
  # ───────────── فحص سريع قبل البناء: إن فشل هنا لا يضيع وقت بناء APK ─────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: مكتبات الاختبار
        run: pip install Pillow openpyxl arabic-reshaper "python-bidi==0.4.2"
      - name: فحص التوافق مع أندرويد (لا opencv/tesseract/numpy)
        run: python tools/check_mobile_deps.py
      - name: فحص الإقلاع بكل تخطيطات التشغيل (يمنع خطأ relative import)
        run: python tools/check_launch.py
      - name: الاختبارات
        run: python -m unittest discover -s daftari/tests -t .

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: تهيئة الذاكرة (swap 8GB + تحرير قرص) — يمنع الإغلاق 143
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx2g
          android.useAndroidX=true
          PROPS
          free -h; df -h /
      - name: تثبيت Flet
        run: pip install "flet>=0.81" flet-cli flet-desktop
      - name: بناء APK
        run: flet build apk --yes --no-rich-output --verbose --build-number ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: daftari-apk
          path: build/apk/*.apk
          if-no-files-found: error
      - name: سجل البناء عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: |
            build/flutter/build/**/outputs/logs/**
            ~/.flet/log/**
          if-no-files-found: ignore

  # ───────────── يشغّل الـ APK الحقيقي على محاكي أندرويد ويفشل إن ظهر أي خطأ بايثون ─────────────
  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true          # تقرير فقط: فشل المحاكي لا يمنع الإصدار (راجع ملف android-smoke-evidence)
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: daftari-apk
          path: apk
      - name: تفعيل KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell monkey -p com.alomar.daftari -c android.intent.category.LAUNCHER 1
            sleep 45
            adb logcat -d > logcat.txt
            adb exec-out screencap -p > screen.png
            if grep -E "ImportError|ModuleNotFoundError|Traceback \(most recent call last\)|attempted relative import" logcat.txt; then
              echo "::error::ظهر خطأ بايثون عند تشغيل التطبيق على المحاكي"; exit 1
            fi
            echo "التشغيل نظيف: لا أخطاء بايثون"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: |
            logcat.txt
            screen.png
          if-no-files-found: ignore

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: تثبيت Flet
        run: pip install "flet>=0.81" flet-cli flet-desktop
      - name: بناء exe
        run: flet build windows --yes --no-rich-output --verbose --build-number ${{ github.run_number }}
      - name: ضغط النتيجة
        shell: pwsh
        run: Compress-Archive -Path build/windows/* -DestinationPath daftari-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: daftari-windows
          path: daftari-windows.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/daftari-apk/*.apk
            dist/daftari-windows/daftari-windows.zip
