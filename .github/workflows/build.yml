name: Build Application (APK & EXE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=0.81" flet-cli flet-desktop

      - name: Pin jni_flutter (fix build)
        shell: pwsh
        run: |
          @'

          [tool.flet.flutter.pubspec.dependency_overrides]
          jni_flutter = "1.0.3"
          '@ | Add-Content -Path pyproject.toml -Encoding utf8
          Get-Content pyproject.toml -Tail 5

      - name: Build Windows Executable
        shell: pwsh
        run: |
          flet build windows --yes --no-rich-output --verbose --build-number ${{ github.run_number }} 2>&1 | Tee-Object -FilePath build_log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show Windows Error Summary
        if: failure()
        shell: pwsh
        run: |
          Select-String -Path build_log.txt -Pattern "error|Exception|failed" -Context 3,5 | Select-Object -First 40 | ForEach-Object { $_.ToString() }
          Write-Host "----- LAST 60 LINES -----"
          Get-Content build_log.txt -Tail 60

      - name: Upload Windows Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build_log.txt
          if-no-files-found: ignore

      - name: Zip Windows Output
        shell: pwsh
        run: Compress-Archive -Path build/windows/* -DestinationPath daftari-windows.zip

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daftari-Windows-App
          path: daftari-windows.zip
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip curl git xz-utils libglu1-mesa

      - name: Prepare Memory (swap + free disk + gradle)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx2g
          android.useAndroidX=true
          PROPS
          free -h; df -h /

      - name: Accept Android Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"; fi
          echo "Using sdkmanager: $SDKM"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=0.81" flet-cli flet-desktop

      - name: Pin jni_flutter (fix Android build)
        run: |
          printf '\n[tool.flet.flutter.pubspec.dependency_overrides]\njni_flutter = "1.0.3"\n' >> pyproject.toml
          tail -5 pyproject.toml

      - name: Build Android APK
        run: |
          set -o pipefail
          flet build apk --yes --no-rich-output --verbose --build-number ${{ github.run_number }} 2>&1 | tee build_log.txt

      - name: Show Build Error Summary
        if: failure()
        run: |
          echo "===== command not found / 127 ====="
          grep -n -i -B 6 -A 3 -E "command not found|not found|No such file|exit code 127|returned 127" build_log.txt | head -150 || true
          echo "===== What went wrong ====="
          grep -n -A 12 -E "What went wrong|FAILURE:|Execution failed" build_log.txt | head -80 || true

      - name: Upload Android Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build_log.txt
          if-no-files-found: ignore

      - name: List Build Output
        if: always()
        run: |
          find build -maxdepth 3 2>/dev/null | head -50 || true
          find . -name "*.apk" 2>/dev/null | head -20 || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daftari-Android-APK
          path: build/apk/*.apk
          if-no-files-found: error
